<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#5d6b7c;--pr:#c8102e;--ok:#1a8a4a;--no:#c0392b;--bd:#dde2e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--card:#1e242c;--tx:#e8ecf1;--mu:#9aa7b6;--pr:#ff5a73;--ok:#4cc380;--no:#ff7a6b;--bd:#333c47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181e;--card:#1e242c;--tx:#e8ecf1;--mu:#9aa7b6;--pr:#ff5a73;--ok:#4cc380;--no:#ff7a6b;--bd:#333c47;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.1rem;margin:1.2em 0 .5em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.mu{color:var(--mu);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px}
button.p{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,var(--card))}
.opt.sel{border-color:var(--pr);border-width:2px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:20px;background:var(--bd);margin-right:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex{border-left:4px solid var(--pr);padding:6px 12px;margin-top:10px;background:var(--bg);border-radius:6px}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}
.w{color:var(--no);font-weight:600}.g{color:var(--ok);font-weight:600}.l{justify-content:flex-start;margin:12px 0}.mt ul,.mt ol{padding-left:20px}.mt h2{margin-top:0}.mt li{margin:.35em 0}
</style>
</head>

{c:"TKP",q:"Anda petugas loket. Seorang warga marah karena antrean lama dan berkas ternyata kurang lengkap. Sikap Anda:",o:["Menjelaskan dengan tenang, meminta maaf atas antrean, lalu membantu daftar kelengkapan berkas","Menjelaskan aturan dan menyuruhnya melengkapi berkas dulu","Meminta petugas lain menangani","Membiarkan sampai tenang","Membalas dengan nada tinggi karena sudah ada aturan"],s:[5,4,2,2,1],e:"Skor tertinggi: empati + solusi nyata. Pelayanan publik menuntut ramah, jelas, dan membantu. Membalas dengan emosi adalah yang paling rendah."},

{c:"TKP",q:"Dalam tim, satu rekan tidak mengerjakan bagiannya sehingga target terancam. Anda:",o:["Mengerjakan sendiri semuanya tanpa bicara","Melapor ke atasan tanpa bicara ke rekan itu","Menanyakan kendalanya, menawarkan bantuan, dan menyepakati ulang pembagian tugas","Membiarkan agar ia belajar","Menyindir di grup"],s:[3,2,5,1,1],e:"Kerja sama: komunikasi langsung dan solusi bersama dulu, baru eskalasi bila perlu."},

{c:"TWK",q:"Menurut UUD 1945, MPR terdiri atas anggota DPR dan anggota ...",o:["DPD","DPRD","Mahkamah Konstitusi","Menteri","TNI"],a:0,e:"Pasal 2 ayat (1): MPR terdiri atas anggota DPR dan DPD yang dipilih melalui pemilu."},

{c:"TKP",q:"Seorang lansia kesulitan memakai layanan online kantor Anda. Anda:",o:["Membantu langkah demi langkah dengan sabar","Menyuruhnya meminta bantuan keluarga","Mengarahkan ke video panduan lalu meninggalkannya","Menyuruhnya datang lagi nanti","Menyelesaikan untuknya tanpa menjelaskan"],s:[5,2,3,1,4],e:"Pelayanan publik: empati dan membantu sampai tuntas, sambil mengedukasi."},
{c:"TKP",q:"Vendor memberi Anda amplop sebagai ucapan terima kasih setelah proyek selesai. Anda:",o:["Menolak dan melaporkan sesuai ketentuan gratifikasi","Menerima tetapi tidak memakainya","Menerima agar hubungan tetap baik","Menolak tanpa melapor","Menerima separuhnya"],s:[5,2,1,4,1],e:"Integritas: tolak gratifikasi dan laporkan sesuai aturan."},
{c:"TKP",q:"Anda ditugaskan di daerah dengan adat berbeda dari asal Anda. Anda:",o:["Mempelajari adat setempat dan beradaptasi","Tetap memakai kebiasaan sendiri","Hanya bergaul dengan sesama pendatang","Bertanya ke rekan lokal tentang hal yang pantas","Mengamati saja tanpa bergabung"],s:[5,1,2,4,3],e:"Sosial budaya: aktif menghormati dan menyesuaikan diri."},
{c:"TKP",q:"Anda menerima email mencurigakan yang meminta kata sandi akun kantor. Anda:",o:["Tidak mengklik, melaporkan ke tim TI, lalu menghapus","Mengklik untuk memastikan","Meneruskan ke rekan","Mengabaikan saja","Membalas dan menanyakan pengirimnya"],s:[5,1,2,3,2],e:"TIK: waspada phishing dan laporkan agar tim TI bisa melindungi pihak lain."},
{c:"TKP",q:"Target bulanan unit Anda sulit tercapai. Anda:",o:["Menganalisis hambatan, menyusun strategi, dan melaporkan progres","Meminta target diturunkan","Menyalahkan kondisi","Bekerja lebih lama tanpa evaluasi","Menunggu arahan atasan"],s:[5,2,1,3,3],e:"Orientasi hasil: analisis, perbaiki cara kerja, dan komunikasikan."},
{c:"TKP",q:"Pendapat Anda berbeda dari mayoritas dalam rapat. Anda:",o:["Menyampaikan pendapat dengan data dan menghormati keputusan bersama","Diam saja","Memaksakan pendapat sampai diterima","Menyampaikan keberatan di luar rapat","Mengikuti saja walau yakin keliru"],s:[5,2,1,2,3],e:"Kerja sama: sampaikan argumen secara santun, lalu patuhi keputusan kolektif."},

{t:'Topik A · Deret angka',h:'<p>Deret angka menuntut Anda menemukan pola dari beberapa suku pertama.</p><b>Jenis pola</b><ul><li>Beda tetap (aritmetika): 3, 7, 11, 15 → +4. Un = a + (n−1)b.</li><li>Rasio tetap (geometri): 2, 6, 18, 54 → ×3. Un = a × r^(n−1).</li><li>Beda bertingkat: 2, 3, 5, 8, 12 → bedanya 1, 2, 3, 4, jadi berikutnya 12 + 5 = 17.</li><li>Fibonacci: tiap suku = jumlah dua suku sebelumnya (1, 1, 2, 3, 5, 8).</li><li>Pola selang-seling: pisahkan suku ganjil dan genap, cari pola masing-masing.</li></ul><b>Langkah cepat</b><ol><li>Hitung selisih antar suku.</li><li>Jika selisih tidak tetap, cek rasio (÷).</li><li>Jika belum ketemu, cek selisih dari selisih, bilangan kuadrat, atau pola selang-seling.</li></ol><b>Contoh</b><p>5, 10, 20, 40, ... → rasio ×2, jawaban 80.</p><i>Tips: kerjakan deret yang polanya langsung terlihat, tandai yang rumit untuk belakangan.</i>'},
{t:'Topik B · Persentase, perbandingan, soal cerita',h:'<b>Persentase</b><ul><li>10% = 1/10, 20% = 1/5, 25% = 1/4, 50% = 1/2, 12,5% = 1/8.</li><li>Diskon bertingkat dikalikan, bukan dijumlahkan: diskon 20% lalu 10% → ×0,8 ×0,9 = ×0,72 (total diskon 28%).</li><li>Harga akhir = harga awal × (100 ± p)/100.</li></ul><b>Perbandingan</b><ul><li>a : b = m : n dengan jumlah T → a = m/(m+n) × T.</li><li>Contoh: 3 : 5, jumlah 40 → satu bagian = 40 ÷ 8 = 5, jadi 15 dan 25.</li></ul><b>Soal cerita</b><ul><li>Jarak = kecepatan × waktu.</li><li>Rata-rata = jumlah ÷ banyak data, jadi jumlah = rata-rata × banyak data.</li></ul><i>Tips: ubah persen ke pecahan sederhana agar hitungan cepat, dan periksa satuan.</i>'},
{t:'Topik C · Verbal dan silogisme',h:'<b>Sinonim dan antonim</b><ul><li>Pahami arti kata, bukan kemiripan bunyi. Coba masukkan kata ke dalam kalimat.</li><li>Jika ragu, eliminasi pilihan yang jelas salah.</li></ul><b>Analogi</b><ul><li>Cari hubungan pasangan kata, lalu terapkan ke pasangan berikutnya.</li><li>Contoh: pisau : memotong = pena : menulis (alat dan fungsi). Hubungan lain: sebab–akibat, bagian–keseluruhan, jenis–golongan.</li></ul><b>Silogisme</b><ul><li>Semua A adalah B; semua B adalah C → semua A adalah C.</li><li>Semua A adalah B; x adalah A → x adalah B.</li><li>Jangan membalik premis: dari Semua A adalah B tidak boleh disimpulkan Semua B adalah A.</li><li>Premis Sebagian tidak cukup untuk kesimpulan Semua.</li></ul><i>Tips: gambar diagram lingkaran (Venn) untuk premis yang rumit.</i>'},
{t:'Topik D · Logika analitis',h:'<b>Pernyataan bersyarat</b><ul><li>Jika p maka q (p → q) ekuivalen dengan kontraposisinya: jika bukan q maka bukan p.</li><li>Konvers (jika q maka p) dan invers (jika bukan p maka bukan q) TIDAK ekuivalen dengan pernyataan awal.</li><li>Contoh: Jika hujan maka jalan basah. Jalan tidak basah → tidak hujan (benar). Jalan basah → belum tentu hujan.</li></ul><b>Negasi</b><ul><li>Negasi Semua A adalah B = Ada A yang bukan B.</li><li>Negasi (p dan q) = bukan p atau bukan q. Negasi (p atau q) = bukan p dan bukan q.</li></ul><b>Penalaran urutan dan posisi</b><ol><li>Tulis semua informasi dalam simbol atau tabel.</li><li>Mulai dari petunjuk yang paling pasti (posisi tertentu).</li><li>Uji tiap pilihan jawaban terhadap semua petunjuk.</li></ol><i>Tips: gunakan hanya informasi yang diberikan, jangan menambah asumsi.</i>'},
{t:'Topik E · Figural (strategi)',h:'<p>Catatan: soal bergambar belum tersedia di aplikasi ini. Materi ini berisi strategi mengerjakannya.</p><b>Analogi gambar</b><ul><li>Bandingkan gambar pertama dengan kedua, temukan perubahannya, lalu terapkan ke pasangan ketiga.</li></ul><b>Cek perubahan satu per satu</b><ul><li>Jumlah elemen (bertambah atau berkurang).</li><li>Bentuk, ukuran, dan warna (isi atau kosong).</li><li>Posisi atau arah: rotasi (45°, 90°, 180°), pencerminan, pergeseran.</li></ul><b>Serial gambar</b><ul><li>Cari pola per elemen: satu elemen bisa berputar 45° tiap langkah, elemen lain bergeser satu posisi.</li><li>Jika sulit, pisahkan elemen dalam gambar dan amati satu per satu.</li></ul><b>Ketidaksamaan gambar</b><ul><li>Cari satu gambar yang berbeda dari yang lain pada jumlah, arah, atau susunan elemen.</li></ul><i>Tips: eliminasi pilihan yang jelas tidak cocok pada satu aturan, lalu lanjut ke aturan berikutnya.</i>'}
],TWK:[
{t:'Topik A · Undang-Undang Dasar 1945',h:'<b>Struktur</b><ul><li>Pembukaan (4 alinea) dan Batang Tubuh. Penjelasan UUD dihapus setelah amandemen.</li><li>UUD 1945 diamandemen 4 kali (1999, 2000, 2001, 2002). Versi hasil amandemen sering disebut berisi 21 bab dan 73 pasal.</li></ul><b>Pasal kunci</b><ul><li>Pasal 1: negara kesatuan berbentuk republik (ayat 1); kedaulatan di tangan rakyat (ayat 2); negara hukum (ayat 3).</li><li>Pasal 2: MPR terdiri atas anggota DPR dan DPD.</li><li>Pasal 7: Presiden dan Wakil Presiden menjabat 5 tahun dan dapat dipilih kembali hanya untuk satu kali masa jabatan.</li><li>Pasal 18: pemerintahan daerah.</li><li>Pasal 24 dan 24C: kekuasaan kehakiman (MA dan MK).</li><li>Pasal 27: persamaan kedudukan; Pasal 28A–28J: hak asasi manusia.</li><li>Pasal 29: agama; Pasal 30: pertahanan dan keamanan; Pasal 31: pendidikan.</li><li>Pasal 33: perekonomian; Pasal 34: kesejahteraan sosial.</li><li>Pasal 36: bahasa negara; 36A: lambang negara; 36B: lagu kebangsaan.</li></ul><i>Tips: hafalkan pasal bersama intinya, bukan nomor saja. Cek selalu perubahan peraturan di sumber resmi (mpr.go.id, peraturan.go.id).</i>'},
{t:'Topik B · Sistem kewarganegaraan',h:'<b>Dasar</b><ul><li>UUD 1945 Pasal 26: warga negara ialah orang bangsa Indonesia asli dan orang bangsa lain yang disahkan dengan undang-undang. Penduduk ialah WNI dan orang asing yang bertempat tinggal di Indonesia.</li><li>Aturan pelaksana: UU No. 12 Tahun 2006 tentang Kewarganegaraan Republik Indonesia.</li></ul><b>Empat asas UU 12/2006</b><ul><li>Ius sanguinis: kewarganegaraan berdasarkan keturunan.</li><li>Ius soli terbatas: berdasarkan tempat lahir, berlaku terbatas bagi anak.</li><li>Kewarganegaraan tunggal: satu kewarganegaraan bagi setiap orang.</li><li>Kewarganegaraan ganda terbatas: untuk anak hingga usia 18 tahun, setelah itu memilih.</li></ul><b>Istilah</b><ul><li>Apatride: tanpa kewarganegaraan. Bipatride: kewarganegaraan ganda.</li></ul><b>Pewarganegaraan (naturalisasi)</b><ul><li>Syarat antara lain: berusia 18 tahun atau sudah kawin; bertempat tinggal di Indonesia dalam jangka waktu tertentu; sehat jasmani dan rohani; dapat berbahasa Indonesia; mengakui Pancasila dan UUD 1945; tidak berkewarganegaraan ganda; berpenghasilan tetap.</li><li>Daftar lengkap ada di Pasal 9 UU 12/2006. Baca teks resminya sebelum ujian.</li></ul><i>Tips: soal biasanya menanyakan asas, istilah (apatride, bipatride), dan siapa yang disebut WNI.</i>'},
{t:'Topik C · Pancasila dan sejarah kebangsaan',h:'<b>Lima sila dan lambang</b><ul><li>Sila 1 Ketuhanan Yang Maha Esa (bintang), sila 2 Kemanusiaan yang adil dan beradab (rantai), sila 3 Persatuan Indonesia (pohon beringin), sila 4 Kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan (kepala banteng), sila 5 Keadilan sosial bagi seluruh rakyat Indonesia (padi dan kapas).</li></ul><b>Fungsi Pancasila</b><ul><li>Dasar negara, ideologi nasional, pandangan hidup, dan pemersatu bangsa.</li></ul><b>Tonggak sejarah</b><ul><li>20 Mei 1908: Kebangkitan Nasional (Budi Utomo). 28 Oktober 1928: Sumpah Pemuda.</li><li>29 Mei–1 Juni 1945: sidang BPUPKI (ketua Radjiman Wedyodiningrat). 1 Juni: pidato Soekarno tentang Pancasila. 22 Juni: Piagam Jakarta.</li><li>17 Agustus 1945: Proklamasi. 18 Agustus 1945: PPKI mengesahkan UUD 1945 dan Pancasila (sila pertama berbeda dari rumusan Piagam Jakarta).</li><li>10 November 1945: pertempuran Surabaya, diperingati sebagai Hari Pahlawan.</li></ul><i>Tips: buat garis waktu singkat dan hafalkan urutannya.</i>'},
{t:'Topik D · Sistem pemerintahan dan lembaga negara',h:'<b>Sistem pemerintahan</b><ul><li>Presidensial: Presiden adalah kepala negara sekaligus kepala pemerintahan. Kekuasaan dibagi (legislatif, eksekutif, yudikatif) dengan prinsip saling mengawasi dan mengimbangi.</li></ul><b>Lembaga negara menurut UUD 1945</b><ul><li>MPR: terdiri atas anggota DPR dan DPD; berwenang mengubah dan menetapkan UUD serta melantik Presiden dan Wakil Presiden.</li><li>DPR: fungsi legislasi, anggaran, dan pengawasan.</li><li>DPD: mewakili daerah, dapat mengajukan dan membahas RUU yang berkaitan dengan daerah.</li><li>Presiden dan Wakil Presiden: dipilih langsung oleh rakyat.</li><li>BPK: memeriksa pengelolaan dan tanggung jawab keuangan negara.</li><li>MA: mengadili pada tingkat kasasi dan menguji peraturan di bawah undang-undang terhadap undang-undang.</li><li>MK: antara lain menguji undang-undang terhadap UUD, memutus sengketa kewenangan lembaga negara, pembubaran partai politik, dan perselisihan hasil pemilu.</li><li>KY: mengusulkan pengangkatan hakim agung dan menjaga kehormatan hakim.</li></ul><i>Tips: bedakan wewenang MA dan MK, soal ini sering muncul. Cek perubahan aturan terbaru di sumber resmi.</i>'},
{t:'Topik E · Bhinneka Tunggal Ika dan NKRI',h:'<b>Bhinneka Tunggal Ika</b><ul><li>Berbeda-beda tetapi tetap satu. Bersumber dari kakawin Sutasoma karya Mpu Tantular dan tercantum pada lambang negara (Pasal 36A UUD 1945).</li></ul><b>Negara Kesatuan Republik Indonesia</b><ul><li>Pasal 1 ayat (1): negara kesatuan berbentuk republik. Pemerintahan daerah diatur dalam Pasal 18; kesatuan masyarakat hukum adat diakui dalam Pasal 18B.</li><li>Wawasan Nusantara: cara pandang bangsa terhadap diri dan lingkungannya yang mengutamakan persatuan dan kesatuan.</li><li>Deklarasi Djuanda (13 Desember 1957) menegaskan laut di antara pulau-pulau sebagai bagian dari wilayah Indonesia. Konsep negara kepulauan diakui UNCLOS 1982.</li><li>Laut teritorial 12 mil laut dari garis pangkal; ZEE 200 mil laut.</li></ul><b>Sikap dalam keberagaman</b><ul><li>Toleransi, gotong royong, dan musyawarah untuk mufakat.</li></ul><i>Tips: hafalkan pasangan istilah dan angkanya (12 mil, 200 mil, 13 Desember 1957).</i>'},
{t:'Topik F · Nasionalisme, bela negara, integritas',h:'<b>Nasionalisme</b><ul><li>Paham cinta tanah air dan rasa kebangsaan yang melahirkan persatuan. Nasionalisme Indonesia berlandaskan Pancasila, bukan chauvinisme.</li></ul><b>Bela negara</b><ul><li>UUD 1945 Pasal 27 ayat (3): setiap warga negara berhak dan wajib ikut serta dalam upaya pembelaan negara. Pasal 30: hak dan kewajiban ikut serta dalam pertahanan dan keamanan negara.</li><li>Lima unsur dasar bela negara: cinta tanah air, sadar berbangsa dan bernegara, yakin Pancasila sebagai ideologi negara, rela berkorban, dan memiliki kemampuan awal bela negara.</li><li>Bela negara tidak hanya militer, tetapi juga lewat profesi, disiplin, dan karya.</li></ul><b>Integritas dan pilar kebangsaan</b><ul><li>Integritas: kesesuaian antara ucapan dan tindakan, jujur, dan konsisten pada nilai.</li><li>Sembilan nilai antikorupsi (KPK): jujur, peduli, mandiri, disiplin, tanggung jawab, kerja keras, sederhana, berani, adil.</li><li>Empat pilar kebangsaan (sebutan MPR): Pancasila, UUD 1945, NKRI, Bhinneka Tunggal Ika.</li></ul><i>Tips: hafalkan daftar unsur, soal sering meminta menentukan mana yang bukan termasuk.</i>'}
],TKP:[
{t:'Topik A · Pola memilih jawaban bernilai 5',h:'<b>Ciri jawaban bernilai tinggi</b><ul><li>Proaktif dan mencari solusi, bukan menunggu.</li><li>Sesuai aturan dan prosedur, jujur, dan berintegritas.</li><li>Santun, empati, dan berkomunikasi terbuka.</li><li>Melibatkan atasan atau tim bila perlu, tanpa melempar tanggung jawab.</li></ul><b>Ciri jawaban bernilai rendah</b><ul><li>Pasif, menunda, atau menghindar.</li><li>Emosional, menyalahkan, atau menyindir.</li><li>Melanggar aturan, menerima gratifikasi, atau mengambil jalan pintas.</li></ul><b>Cara memilih</b><ol><li>Baca semua opsi dulu sebelum memutuskan.</li><li>Urutkan dari yang terbaik sampai terburuk. Setiap opsi punya skor 1–5.</li><li>Pilih yang paling bermanfaat bagi layanan atau organisasi, bukan yang paling nyaman bagi Anda.</li></ol><i>Tips: jawaban bernilai 4 biasanya benar tetapi kurang inisiatif atau kurang tuntas.</i>'},
{t:'Topik B · Indikator dan kata kunci',h:'<p>Kata kunci per indikator (mengikuti daftar di prompt belajar Anda; cek kisi-kisi resmi terbaru).</p><ul><li>Pelayanan publik: ramah, cepat, empati, solusi nyata.</li><li>Jejaring kerja: komunikasi aktif dan prosedur resmi antarinstansi.</li><li>Sosial budaya: toleransi dan menghormati perbedaan secara aktif.</li><li>TIK: mau belajar teknologi baru dan menjaga keamanan data.</li><li>Profesionalisme: bertanggung jawab, mengakui dan memperbaiki kesalahan.</li><li>Integritas: jujur, menolak gratifikasi, tidak memanipulasi data.</li><li>Orientasi hasil: menyelesaikan target dengan strategi dan melapor progres.</li><li>Adaptasi dan kerja sama: terbuka pada perubahan dan menyelesaikan konflik lewat komunikasi.</li></ul><b>Contoh</b><p>Warga marah karena antrean lama. Jawaban terbaik: meminta maaf, menjelaskan dengan tenang, lalu membantu menyelesaikan urusannya. Jawaban terburuk: membalas dengan emosi.</p>'},
{t:'Topik C · Nilai BerAKHLAK dan jebakan umum',h:'<b>Nilai dasar ASN BerAKHLAK</b><ul><li>Berorientasi pelayanan, Akuntabel, Kompeten, Harmonis, Loyal, Adaptif, Kolaboratif. Jadikan kompas saat menilai pilihan jawaban.</li></ul><b>Jebakan umum</b><ul><li>Langsung melapor ke atasan tanpa berusaha dulu biasanya bernilai menengah.</li><li>Opsi ekstrem (selalu, tidak pernah, langsung memarahi) cenderung bernilai rendah.</li><li>Opsi yang memberi hasil cepat tetapi melanggar prosedur adalah jebakan.</li><li>Opsi yang tampak sopan tetapi pasif (diam, menunggu) tidak dapat nilai tertinggi.</li></ul><b>Contoh analisis</b><p>Rekan senior meminta Anda menandatangani dokumen yang belum Anda periksa. Terbaik: memeriksa dulu dan menjelaskan secara santun bahwa Anda perlu memastikan kebenarannya. Menengah: menandatangani karena percaya. Rendah: menolak dengan ketus.</p><i>Tips: tanyakan pada diri sendiri, jika semua orang bertindak seperti ini, apakah pelayanan dan integritas tetap terjaga.</i>'}
]};

document.getElementById('app').innerHTML=h;window.scrollTo(0,0)}

function load(){try{st=JSON.parse(localStorage.getItem("skd")||"null")}catch(e){st=null}if(!st)st={TIU:[0,0],TWK:[0,0],TKP:[0,0],runs:0}}
function save(){try{localStorage.setItem("skd",JSON.stringify(st))}catch(e){}}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pct(c){var d=st[c];return d[1]?Math.round(d[0]/d[1]*100):null}

clearInterval(timer);S={};var h='<h1>Belajar SKD CPNS</h1><p class="mu">Tutor pribadi: diagnostik, latihan, evaluasi, dan simulasi. Kemajuan tersimpan di perangkat ini.</p>';
h+='<div class="card"><b>Gambaran SKD (asumsi latihan)</b><p class="mu">Format SKD umumnya: TWK 30 soal, TIU 35 soal, TKP 45 soal (110 soal, 100 menit). Skor TWK dan TIU 5 per jawaban benar; TKP 1–5 per opsi. Ambang batas berbeda tiap periode seleksi, jadi cek pengumuman resmi BKN/KemenPAN-RB. Aplikasi ini bukan standar resmi.</p></div>';
h+='<div class="card"><div class="row"><b>Tes diagnostik</b><button class="p" onclick="start(\'test\',null)">Mulai (38 soal)</button></div><p class="mu">Ukur kemampuan awal TIU, TWK, TKP. Jawaban dibahas setelah selesai.</p></div>';
h+='<div class="card"><div class="row"><b>Modul materi</b><button class="p" onclick="materi()">Buka</button></div><p class="mu">Belajar konsep per topik, terpisah dari tes. Tersedia untuk TIU, TWK, dan TKP.</p></div>';h+='<h2>Latihan per materi</h2><div class="grid">';
CATS.forEach(function(c){var p=pct(c);h+='<div class="card"><b>'+c+'</b><div class="mu">'+(p===null?'Belum ada data':'Akurasi '+p+'% ('+st[c][0]+'/'+st[c][1]+')')+'</div><div class="bar" style="margin:8px 0"><i style="width:'+(p||0)+'%"></i></div><button onclick="start(\'practice\',\''+c+'\')">Latihan '+c+'</button></div>'});
h+='</div><div class="card"><div class="row"><b>Simulasi CAT (format SKD)</b><button class="p" onclick="start(\'sim\',null)">SIMULASI</button></div><p class="mu">Urutan TWK, TIU, TKP. Waktu 100 menit, skor maks 550 (TWK 150, TIU 175, TKP 225), tanpa pembahasan sampai selesai. TIU penuh 35 soal (angka diacak tiap sesi). TWK baru 16 dari 30 soal dan TKP 16 dari 45 soal, karena bank soal masih bertambah.</p></div>';
h+='<h2>Evaluasi saya</h2><div class="card">';
var any=CATS.some(function(c){return st[c][1]});
if(!any)h+='<span class="mu">Selesaikan tes diagnostik atau latihan untuk melihat evaluasi.</span>';
else{var weak=[],good=[];CATS.forEach(function(c){var p=pct(c);if(p===null)return;(p<60?weak:good).push(c)});
h+='Sesi selesai: '+st.runs+'<br><span class="g">Dikuasai: '+(good.join(", ")||"-")+'</span><br><span class="w">Perlu diperkuat: '+(weak.join(", ")||"-")+'</span><br><span class="mu">Rekomendasi berikutnya: '+(weak[0]?'latihan '+weak[0]+' dulu.':'lanjut simulasi CAT.')+'</span>'}
h+='<div style="margin-top:10px"><button onclick="reset()">Reset progres</button></div></div>';
h+='<h2>Tips dan trik</h2>';CATS.forEach(function(c){h+='<details class="card"><summary>'+c+'</summary><p class="mu">'+TIPS[c]+'</p></details>'});
document.getElementById("app").innerHTML=h}
function reset(){if(confirm("Hapus semua progres?")){st={TIU:[0,0],TWK:[0,0],TKP:[0,0],runs:0};save();home()}}
function start(mode,cat){var l=cat?Q.filter(function(x){return x.c===cat}):Q;if(cat==="TIU")l=l.concat(genTIU().slice(0,8));if(mode==="sim")l=full();S={mode:mode,list:(mode==="sim"?l:sh(l)).map(function(q){var idx=sh(q.o.map(function(_,i){return i}));return{q:q,ord:idx}}),i:0,ans:[],cat:cat,left:100*60};
if(mode==="sim"){timer=setInterval(function(){S.left--;var t=document.getElementById("tm");if(t)t.textContent=fmt(S.left);if(S.left<=0)finish()},1000)}
show()}
function fmt(s){s=Math.max(0,s);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}

var h='<div class="row"><button onclick="if(confirm(\'Keluar?\'))home()">← Keluar</button>'+(S.mode==="sim"?'<b id="tm">'+fmt(S.left)+'</b>':'')+'<span class="mu">'+(S.i+1)+'/'+S.list.length+'</span></div><div class="bar" style="margin:10px 0"><i style="width:'+(S.i/S.list.length*100)+'%"></i></div>';
h+='<div class="card"><span class="tag">'+q.c+'</span><p><b>'+q.q+'</b></p>';
it.ord.forEach(function(oi,k){var cls="opt";if(done){if(fb){var good=q.c==="TKP"?q.s[oi]===5:oi===q.a;if(good)cls+=" ok";else if(S.ans[S.i]===oi)cls+=" no"}else if(S.ans[S.i]===oi)cls+=" sel"}
h+='<button class="'+cls+'" '+(done&&fb?'disabled':'')+' onclick="pick('+oi+')">'+"ABCDE"[k]+". "+q.o[oi]+'</button>'});

h+=(S.mode==="sim"?'<hr><div class="row"><b>Total</b><span>'+(tot.TIU+tot.TWK+tot.TKP)+' / 550</span></div><p class="mu">Skor dihitung dari soal yang tersedia ('+S.list.length+' dari 110 soal resmi). Maks resmi: TWK 150, TIU 175, TKP 225.</p>':'')+'</div>';
{var wr=0;h+='<h2>Pembahasan jawaban yang salah</h2>';S.list.forEach(function(it,i){var q=it.q,a=S.ans[i],ok=q.c==="TKP"?(a!==undefined?q.s[a]+"/5":"kosong"):(a===q.a?"benar":"salah");if(q.c==="TKP"?(a!==undefined&&q.s[a]===5):a===q.a)return;wr++;
var best=q.c==="TKP"?q.o[q.s.indexOf(5)]:q.o[q.a];h+='<div class="card"><span class="tag">'+q.c+'</span><span class="tag">'+ok+'</span><p>'+q.q+'</p><div class="mu">Jawaban Anda: '+(a!==undefined?q.o[a]:"tidak dijawab")+'</div><div class="mu">Jawaban terbaik: '+best+'</div><div class="ex">'+q.e+'</div></div>'});if(!wr)h+='<div class="card g">Semua jawaban benar, tidak ada yang perlu dibahas.</div>'}
